[project]
name = "secact-reference-tests"
version = "0.0.0"
description = "Tests for the SecAct reference"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "secactpy @ https://github.com/instantomics/secact/releases/download/secactpy-wheel-v0.3.1/secactpy-0.3.1%2Bnumpy2-py3-none-any.whl",
  "pyarrow",
  "pytest==9.1.1",
  "ruff==0.12.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
