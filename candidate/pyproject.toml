[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secact-candidate"
version = "0.0.0"
description = "Ordinary Iomix ligand_activity candidate wrapping SecActpy"
requires-python = ">=3.13,<3.14"
dependencies = [
  # SecActpy 0.3.1 with only its numpy<2 cap lifted; see the README.
  "secactpy @ https://github.com/instantomics/secact/releases/download/secactpy-wheel-v0.3.1/secactpy-0.3.1%2Bnumpy2-py3-none-any.whl",
  "numpy",
  "pandas",
  "pyarrow",
  "scipy",
]

[project.optional-dependencies]
cpu = []
cu128 = []
cu130 = []

[tool.uv]
# The task pins google-crc32c<1.9: 1.9.0 was published without Linux wheels.
constraint-dependencies = ["google-crc32c<1.9"]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
]

[tool.setuptools.packages.find]
where = ["src"]
