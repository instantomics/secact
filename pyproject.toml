[project]
name = "secact-reference-tests"
version = "0.0.0"
description = "Tests for the SecAct reference"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "secactpy==0.3.1",
  "pyarrow",
  "pytest==9.1.1",
  "ruff==0.12.8",
]

[tool.uv]
package = false
override-dependencies = ["numpy>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
